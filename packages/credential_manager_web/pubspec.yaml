name: credential_manager_web
description: Web implementation of the credential_manager plugin using Web Authentication API (WebAuthn) and Credential Management API.
version: 2.1.0
homepage: https://djsmk123.github.io/flutter_credential_manager_compose
repository: https://github.com/Djsmk123/flutter_credential_manager_compose
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  credential_manager_platform_interface: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: CredentialManagerWebPlugin
        fileName: credential_manager_web.dart
  
  # Include JavaScript bundle as asset
  assets:
    - web/passkey_authenticator.js


