name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Note: these intentionally point at buildable source (lib/**,
          # android/**, ios/**, web/**, pubspec.yaml, analysis_options.yaml),
          # not whole-package globs - a package's own *.md docs shouldn't
          # trigger its native build/lint job.
          filters: |
            dart:
              - 'packages/**/*.dart'
              - 'packages/**/pubspec.yaml'
              - 'packages/**/analysis_options.yaml'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yml'
            android:
              - 'packages/credential_manager_android/android/**'
              - 'packages/credential_manager_android/lib/**'
              - 'packages/credential_manager_android/pubspec.yaml'
              - 'packages/credential_manager_android/analysis_options.yaml'
              - 'packages/credential_manager_platform_interface/lib/**'
              - 'packages/credential_manager_platform_interface/pubspec.yaml'
              - 'packages/credential_manager_platform_interface/analysis_options.yaml'
              - 'packages/credential_manager/lib/**'
              - 'packages/credential_manager/pubspec.yaml'
              - 'packages/credential_manager/analysis_options.yaml'
              - 'packages/credential_manager/example/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'packages/credential_manager_ios/ios/**'
              - 'packages/credential_manager_ios/lib/**'
              - 'packages/credential_manager_ios/pubspec.yaml'
              - 'packages/credential_manager_ios/analysis_options.yaml'
              - 'packages/credential_manager_platform_interface/lib/**'
              - 'packages/credential_manager_platform_interface/pubspec.yaml'
              - 'packages/credential_manager_platform_interface/analysis_options.yaml'
              - 'packages/credential_manager/lib/**'
              - 'packages/credential_manager/pubspec.yaml'
              - 'packages/credential_manager/analysis_options.yaml'
              - 'packages/credential_manager/example/**'
              - '.github/workflows/ci.yml'
            web:
              - 'packages/credential_manager_web/lib/**'
              - 'packages/credential_manager_web/web/**'
              - 'packages/credential_manager_web/pubspec.yaml'
              - 'packages/credential_manager_web/analysis_options.yaml'
              - 'packages/credential_manager_platform_interface/lib/**'
              - 'packages/credential_manager_platform_interface/pubspec.yaml'
              - 'packages/credential_manager_platform_interface/analysis_options.yaml'
              - 'packages/credential_manager/lib/**'
              - 'packages/credential_manager/pubspec.yaml'
              - 'packages/credential_manager/analysis_options.yaml'
              - 'packages/credential_manager/example/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docSite/**'
              - '.github/workflows/ci.yml'

  format:
    name: Dart format (120 cols)
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos bootstrap
      - name: Check formatting
        run: dart format . --line-length 120 --page-width 120 --set-exit-if-changed

  analyze:
    name: Flutter analyze
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos bootstrap
      - name: Analyze all packages
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos run analyze

  android-build:
    name: Android build (example app)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        working-directory: packages/credential_manager/example
        run: flutter pub get
      - name: Build Android APK (debug)
        working-directory: packages/credential_manager/example
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: flutter build apk --debug --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

  android-lint:
    name: Android lint (Detekt)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Detekt
        working-directory: packages/credential_manager_android/android
        run: ./gradlew detekt --no-daemon

  ios-build:
    name: iOS build (example app, SPM)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Get dependencies
        working-directory: packages/credential_manager/example
        run: flutter pub get
      - name: Build iOS (simulator, no codesign)
        working-directory: packages/credential_manager/example
        run: flutter build ios --debug --no-codesign --simulator

  ios-lint:
    name: iOS lint (SwiftLint)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        working-directory: packages/credential_manager_ios
        run: swiftlint lint --strict

  web-build:
    name: Web build (example app)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        working-directory: packages/credential_manager/example
        run: flutter pub get
      - name: Build web
        working-directory: packages/credential_manager/example
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: flutter build web --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

  docs-build:
    name: Docs site build check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docSite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docSite/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build docs (verify only, no deploy)
        run: npm run build
